<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pianist · 3D Piano</title>
	<link rel="icon" type="image/png" href="/favicon.png">
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
		canvas { display: block; touch-action: none; }
		#ptshot { position: fixed; left: 12px; top: 12px; z-index: 1000;		/* (top left: the GUI is on the right, the HUD and the power button at the bottom left) */ width: 320px; max-width: calc( 100vw - 24px ); border-radius: 8px; overflow: hidden; background: rgba(0,0,0,.6); box-shadow: 0 4px 18px rgba(0,0,0,.45); font: 12px/1.3 system-ui, sans-serif; color: #ddd; }
		#ptshot[hidden] { display: none; }
		#ptshot .view { display: block; width: 100%; padding: 0; border: 0; background: #111; cursor: zoom-in; }
		#ptshot .view canvas { display: block; width: 100%; height: auto; }
		#ptshot .view:focus-visible, #ptshot .close:focus-visible { outline: 2px solid #d9b26f; outline-offset: -2px; }
		#ptshot .bar { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; }
		#ptshot .status { flex: 1; }
		#ptshot .spp { color: #aaa; font-variant-numeric: tabular-nums; }
		#ptshot .close { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #bbb; font-size: 18px; line-height: 1; cursor: pointer; }
		#ptshot .close:hover { background: rgba(255,255,255,.12); color: #fff; }
		#hud { position: fixed; left: 12px; bottom: 10px; padding: 6px 10px; border-radius: 6px; background: rgba(0,0,0,.45); pointer-events: none; }
		/* screen power (piano roll on/off), also the ` key */
		#power { position: fixed; left: 12px; bottom: 46px; width: 34px; height: 34px; padding: 7px; border-radius: 50%; border: 1px solid #4a4a4c; background: rgba(0,0,0,.5); color: #77777a; cursor: pointer; transition: color .25s, box-shadow .25s, border-color .25s; }
		#power svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
		#power:hover { color: #9c9ca0; border-color: #5c5c60; }
		#power[aria-pressed="true"]:hover { color: #ee5a60; border-color: #8a2a2e; }
		#power[aria-pressed="true"] { color: #e0484e; border-color: #8a2a2e; box-shadow: 0 0 10px rgba(224,72,78,.45); }
		/* Loading screen (artwork: tools/build-loading-svg.mjs). The light sweeps are CSS transform
		   animations on their own layers, masked by the line art, so the compositor keeps them
		   moving while the main thread is busy building the scene. */
		#loading { position: fixed; inset: 0; z-index: 2000; display: grid; place-content: center; justify-items: center; gap: 28px; background: #0e0e0f; transition: opacity .6s ease, visibility 0s .6s; }
		#loading.hidden { opacity: 0; visibility: hidden; }
		#loading .art { position: relative; width: min( 78vw, 460px ); aspect-ratio: 400 / 280; }
		#loading .art > * { position: absolute; inset: 0; }
		#loading .base { width: 100%; height: 100%; animation: ld-breathe 5.35s ease-in-out infinite; }
		#loading .lane { overflow: hidden; -webkit-mask: var( --m ) center / 100% 100% no-repeat; mask: var( --m ) center / 100% 100% no-repeat; }
		#loading .lane i { position: absolute; will-change: transform; animation-duration: 5.35s; animation-timing-function: cubic-bezier( .4, 0, .6, 1 ); animation-iteration-count: infinite; }
		/* played keys: one element per key, uniform amber, flashing in turn (delays generated) */
		#loading .played b { position: absolute; background: #d9b26f; opacity: 0; will-change: opacity; animation-name: ld-key; animation-duration: 5.35s; animation-timing-function: linear; animation-iteration-count: infinite; animation-fill-mode: backwards; }
		#loading .strings { --m: url( loading/mask-strings.svg ); }
		#loading .strings i { left: 0; right: 0; top: 0; height: 43%; background: linear-gradient( 0deg, #d9b26f00, #d9b26f, #d9b26f00 ); animation-name: ld-strings; }
		#loading .flow { --m: url( loading/mask-flow.svg ); }
		#loading .flow i { top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient( 90deg, #d9b26f00, #d9b26f, #d9b26f00 ); animation-name: ld-flow; }
		#loading .label { font: 500 11px/1 system-ui, sans-serif; letter-spacing: .38em; text-transform: uppercase; color: #e9e4da8c; padding-left: .38em; }
		/* three phases of 42% of the cycle: the strings start when the keyboard sweep is a third of the
		   way (14%), the streamlines after 60% of the strings phase (39%);
		   each light travels only across its own lines (keys x 104..306, strings y 40..204, body and
		   streamlines x 112..400 of the 400 x 280 artwork) and fades in / out at its ends */
		@keyframes ld-key { 0% { opacity: 0 } 1.5% { opacity: 1 } 10%, 100% { opacity: 0 } }
		@keyframes ld-strings { 0%, 14% { transform: translateY( 142% ); opacity: 0 } 20%, 50% { opacity: 1 } 56%, 100% { transform: translateY( -33% ); opacity: 0 } }
		@keyframes ld-flow { 0%, 39% { transform: translateX( 12.5% ); opacity: 0 } 45%, 75% { opacity: 1 } 81%, 100% { transform: translateX( 212% ); opacity: 0 } }
		@keyframes ld-breathe { 0%, 100% { opacity: .82 } 50% { opacity: 1 } }
		@media ( prefers-reduced-motion: reduce ) { #loading .lane i, #loading .base, #loading .played b { animation: none; } }
		/* an error while the scene is built: its message and a reload in place of the label (the boot stops there:
		   the loading screen stayed up, spinning, with nothing said); kept up if the boot hides the screen after it */
		#loading .err { display: none; max-width: min( 86vw, 620px ); text-align: center; }
		#loading.failed .err { display: grid; gap: 14px; justify-items: center; }
		#loading.failed .label { display: none; }
		#loading.failed .lane i, #loading.failed .base, #loading.failed .played b { animation: none; }
		#loading.failed .base { opacity: .35; }
		#loading.failed.hidden { opacity: 1; visibility: visible; }
		#loading .err h2 { margin: 0; font: 500 12px/1 system-ui, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #ee8a7a; }
		#loading .err pre { margin: 0; max-height: 34vh; overflow: auto; padding: 10px 12px; border-radius: 6px; background: #ffffff0d; color: #e9e4dacc; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; text-align: left; user-select: text; }
		#loading .err .row { display: flex; gap: 10px; }
		#loading .err button { padding: 9px 22px; border-radius: 20px; border: 1px solid #d9b26f99; background: transparent; color: #f2efe8; font: 500 13px/1 system-ui, sans-serif; letter-spacing: .05em; cursor: pointer; }
		#loading .err button:hover, #loading .err button:focus-visible { border-color: #d9b26f; background: #d9b26f1f; outline: none; }
		#loading .err button.quiet { border-color: #ffffff33; color: #e9e4da99; }
		/* the concert hall's loading bar (src/main.js): over the loading screen or the scene; the sheen a
		   compositor animation, so it moves while the main thread is busy */
		#hallbar { position: fixed; left: 50%; bottom: 9vh; z-index: 2001; width: min( 70vw, 320px ); transform: translateX( -50% ); display: grid; gap: 9px; justify-items: center; opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility 0s .4s; pointer-events: none; }
		/* over the loading screen: just under its label (the artwork's height is .7 of its width, the gap 28px, the label 11px) */
		#loading:not(.hidden) ~ #hallbar { bottom: auto; top: calc( 50% + min( 78vw, 460px ) * .35 + 52px ); }
		#hallbar.show { opacity: 1; visibility: visible; transition: opacity .4s ease; }
		#hallbar .track { position: relative; width: 100%; height: 3px; border-radius: 2px; overflow: hidden; background: #ffffff1f; }
		#hallbar .track i { position: absolute; inset: 0; background: #d9b26f; transform-origin: left; transform: scaleX( 0 ); transition: transform .25s linear; }
		#hallbar .track b { position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient( 90deg, #ffffff00, #ffffff59, #ffffff00 ); will-change: transform; animation: hb-sheen 1.6s ease-in-out infinite; }
		#hallbar span { font: 500 10px/1 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #e9e4da99; font-variant-numeric: tabular-nums; }
		@keyframes hb-sheen { from { transform: translateX( -100% ) } to { transform: translateX( 340% ) } }
		@media ( prefers-reduced-motion: reduce ) { #hallbar .track b { animation: none; display: none; } #hallbar .track i { transition: none; } }
		#drop { position: fixed; inset: 0; display: none; place-items: center; background: rgba(10,12,14,.72); border: 3px dashed rgba(255,255,255,.55); box-sizing: border-box; font-size: 20px; letter-spacing: .04em; pointer-events: none; z-index: 10; }
		#drop.show { display: grid; }
		/* a script opened from the URL waits here for a click: browsers start audio only after one */
		#start { position: fixed; inset: 0; display: none; place-items: center; background: rgba(6,8,10,.55); z-index: 11; }
		#start.show { display: grid; }
		#start button { display: flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 28px; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.55); color: #f2efe8; font: 500 17px/1.2 system-ui, sans-serif; letter-spacing: .03em; cursor: pointer; }
		#start button:hover { border-color: rgba(255,255,255,.7); }
		#start svg { width: 18px; height: 18px; fill: currentColor; }
	</style>
</head>

	<div id="start"><button type="button"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg><span>Play</span></button></div>
	<script>
		// errors while the scene is built (before src/main.js hides the loading screen): shown on it, with a reload.
		// A plain script before the module, so it also sees the module failing to load or to parse
		( () => {

			const box = document.getElementById( 'loading' ), pre = box.querySelector( '.err pre' ), seen = [];
			const building = () => ! box.classList.contains( 'hidden' ) || box.classList.contains( 'failed' );
			const show = ( what ) => {

				if ( ! building() || seen.length >= 6 ) return;
				let text = what instanceof Error ? `${ what.name }: ${ what.message }${ what.stack ? '\n' + what.stack.split( '\n' ).filter( l => ! l.startsWith( what.name ) ).slice( 0, 6 ).join( '\n' ) : '' }` : String( what );
				if ( seen.includes( text ) ) return;
				seen.push( text );
				pre.textContent = seen.join( '\n\n' );
				if ( ! box.classList.contains( 'failed' ) ) { box.classList.add( 'failed' ); box.setAttribute( 'aria-label', 'The scene failed to load' ); box.querySelector( '.reload' ).focus(); }

			};
			box.querySelector( '.reload' ).onclick = () => location.reload();
			box.querySelector( '.dismiss' ).onclick = () => { box.classList.remove( 'failed' ); box.classList.add( 'hidden' ); };
			// (a script or module that does not load: an error on its element, seen only while capturing)
			addEventListener( 'error', e => {

				if ( e.target instanceof HTMLScriptElement ) show( `${ e.target.src || 'a script' } did not load` );
				else if ( e.target === window || e.target === document || ! e.target ) show( e.error ?? `${ e.message }${ e.filename ? `\n  at ${ e.filename }:${ e.lineno }:${ e.colno }` : '' }` );

			}, true );
			addEventListener( 'unhandledrejection', e => show( e.reason ?? 'a promise was rejected' ) );
			// three reports a shader that does not compile on the console only (the scene then draws black or not at all)
			const err = console.error.bind( console );
			console.error = ( ...a ) => { err( ...a ); if ( typeof a[ 0 ] === 'string' && /Shader Error|shader is not compiled|Program Info Log/i.test( a[ 0 ] ) ) show( a.join( ' ' ).slice( 0, 2000 ) ); };

		} )();
	</script>
	<script type="module" src="/src/main.js"></script>
