# Liszt: Liebestraum No. 3 (the Transkun transcription of a performance, midi/songs/liszt-liebestraum3.transkun.mid),
# on the black grand in the Konzerthaus Berlin (its Recital light), filmed by a moving camera round the piano.
# Load with ?style=grand-black&script=liebestrum.yaml (the style: a query, not a script setting: setting it
# here would rebuild the piano and load the hall after the script had started); render with
#   node tools/render-video.mjs liebestrum.yaml --query "style=grand-black" [--to 272.5]
# or path traced: tools/pt-client.mjs video liebestrum.yaml --query "style=grand-black" ...
#
# The piece (the file's own times; the script plays it from 4 s, so script time = file time + 4):
#   5-69 s     the theme, quiet, in the middle voice            shots 2-3: a slow orbit to the keys, then on to the bass
#   72-88      the first cadenza                                shot 4: low along the keyboard from the treble end
#   93-112     the theme again, rising                          shot 5: over the player's shoulder, rising
#   114-172    the climax (loudest: velocities ~85)             shot 6: a long orbit round the open lid and the tail
#   ~158-170   the second cadenza                               shot 7: from above, into the strings
#   174-227    the theme, calm again                            shot 8: from the back of the stage, the hall beyond
#   227-259    the coda, sparse                                 shot 9: close at the bass end, drawing back
#   259-266    a long held silence (the pedal, a chord ringing)  shot 10: rising away from the stage
#   (the file is cut at 268 s; its last chord's pedal lifts at 266.4 (script 270.4); the script ends at 272.5,
#   the recital light back)
#
# The frame: the stage floor y 0, the piano at the origin (its keyboard's front z 0.46, x -0.7..0.7; the bench
# at z 0.94; the tail at z -1.12; the lid opening towards +x, the audience); the stalls towards +x, the shell
# behind the stage towards -x.
title: Liebestraum No. 3 — the black grand, Konzerthaus Berlin
seed: 1            # the render's random seed: the particles, the path tracer's noise (src/main.js); the same at the same fps

midi:
  liebestraum: songs/liszt-liebestraum3.transkun.mid

timeline:
  # 1. the hall from the stalls, pushing in towards the stage
  - at: 0
    set:
      Lighting/Preset: Recital
    handheld: { enabled: false }
    # power the piano-roll screen on at the beginning; its boot animation leads into the first theme
    screen: on
    camera: { position: [ 7.5, 1.6, 2.6 ], target: [ 0, 1.0, -0.3 ], fov: 34 }
  - at: 0.1
    camera:
      duration: 9
      ease: inOutSine
      path:
        - { position: [ 4.2, 1.45, 1.7 ], target: [ 0, 0.98, -0.25 ], fov: 32 }
  - at: 4          # the playing begins: the hall fades to the spotlight
    midi: liebestraum
    duration: 4
    ease: inOutSine
    set:
      Lighting/Preset: Spotlight

  # 2. the theme: a slow orbit from the audience's side round to the keys
  - at: 9
    camera:
      duration: 32
      ease: inOutSine
      path:
        - { position: [ 3.2, 1.35, 2.2 ], target: [ 0, 0.95, -0.15 ] }
        - { position: [ 1.8, 1.25, 2.6 ], target: [ 0, 0.92, -0.1 ] }
        - { position: [ 0.6, 1.3, 2.4 ], target: [ 0, 0.9, -0.1 ], fov: 31 }

  # 3. on past the player to the bass end
  - at: 41
    camera:
      duration: 32
      ease: inOutSine
      path:
        - { position: [ -0.6, 1.35, 2.0 ], target: [ 0, 0.9, -0.2 ] }
        - { position: [ -1.6, 1.4, 1.2 ], target: [ 0, 0.9, -0.3 ], fov: 30 }

  # 4. the first cadenza: from the stage's back, facing the stalls, a sideways track left to right (towards +z)
  # passing above the piano's spine side: the whole piano below, the open lid, a strip of the front rows beyond; the track
  # dips a little mid-way so the spotlight sweeps across the lid's lacquer and the rim's edge as a passing flash
  - at: 75
    camera: { position: [ -3.4, 2.75, -2.9 ], target: [ 1.0, 0.62, -1.5 ], fov: 36 }
  - at: 75.1
    camera:
      duration: 19
      ease: inOutSine
      path:
        - { position: [ -3.4, 2.55, -0.6 ], target: [ 1.0, 0.62, -0.2 ], fov: 36 }
        - { position: [ -3.4, 2.75, 1.8 ], target: [ 1.0, 0.62, 1.0 ], fov: 36 }

  # 5. the theme rising: over the player's shoulder, the camera rising with it
  - at: 96
    camera: { position: [ -0.35, 1.75, 1.55 ], target: [ 0.1, 0.62, 0.25 ], fov: 32 }		# (down to the wire: the pedals below the keys)
  - at: 96.1
    camera:
      duration: 21
      ease: inOutSine
      path:
        - { position: [ -0.2, 2.2, 1.3 ], target: [ 0, 0.58, -0.05 ], fov: 34 }

  # 6. the climax: a long low arc round the piano's front, right to left (the pedals under the lyre in frame all
  # the way, the bench, the keys, the open lid above)
  - at: 117.5
    camera: { position: [ 3.0, 0.7, 1.9 ], target: [ 0, 0.7, -0.3 ], fov: 40 }   # (front-right, low: the pedals between the legs)
  - at: 117.6
    camera:
      duration: 44
      ease: inOutSine
      path:
        - { position: [ 2.2, 0.9, 2.9 ], target: [ 0, 0.7, -0.2 ], fov: 36 }
        - { position: [ 0.2, 1.0, 3.0 ], target: [ 0, 0.7, -0.3 ], fov: 36 }
        - { position: [ -1.8, 1.2, 2.6 ], target: [ 0, 0.7, -0.4 ], fov: 36 }

  # 7. the second cadenza: from high at the front, into the strings, passing over to the left (oblique: not into the
  # top light's reflection, which blows out straight down); the pedals stay visible below, behind the bench
  - at: 162
    camera: { position: [ 1.8, 2.6, 2.2 ], target: [ 0, 0.55, -0.4 ], fov: 40 }
  - at: 162.1
    camera:
      duration: 15
      path:
        - { position: [ 0.0, 2.4, 2.8 ], target: [ 0, 0.55, -0.5 ], fov: 42 }

  # 8. the theme, calm: low at the back of the stage, looking up: the piano before the hall, its chandeliers and
  # galleries
  - at: 177.5
    camera: { position: [ -4.5, 0.45, 2.6 ], target: [ 3.0, 2.7, -0.8 ], fov: 54 }
  - at: 177.6
    camera:
      duration: 52
      ease: inOutSine
      path:
        - { position: [ -3.0, 0.5, -2.2 ], target: [ 3.0, 2.6, 0.6 ], fov: 52 }

  # 9. the coda: low at the treble end, looking across the piano to the stage's side (its risers and the organ
  # gallery's foot), drawing back; slowing all the way to rest at the end (ease out)
  - at: 230.5
    camera: { position: [ 1.3, 0.5, 0.9 ], target: [ -1.6, 1.3, -0.7 ], fov: 44 }
  - at: 230.6
    camera:
      duration: 33
      ease: out
      path:
        - { position: [ 2.5, 0.65, 2.0 ], target: [ -2.0, 1.5, -0.9 ], fov: 46 }

  - at: 262        # the long held chord (file 257 s): fading back to the recital light
    duration: 3
    ease: inOutSine
    set:
      Lighting/Preset: Recital

  # 10. the held chord: rising away from the stage
  - at: 264
    camera:
      duration: 8
      ease: inOutSine
      path:
        - { position: [ -2.0, 1.8, 2.8 ], target: [ 0, 0.9, -0.3 ] }
        - { position: [ 1.5, 3.0, 4.6 ], target: [ 0, 0.9, -0.3 ], fov: 34 }
  - at: 272.5
    midi: stop
