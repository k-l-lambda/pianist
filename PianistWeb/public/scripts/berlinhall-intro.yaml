    midi: { play: yin/berlinhall-good-evening.mid, roll: voice, think: 0, subtitle: 晚上好，我是智慧钢琴助手小音。今天想听点什么？ }
  # leaning in beside the end of the bench: the screen and the keys, close (~2 s)
