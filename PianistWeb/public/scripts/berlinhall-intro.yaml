    handheld: { enabled: true, shake: 1, walk: 1, drift: 0.2, bursts: false, person: true, floor: true }
    set:
      Lighting/Preset: Spotlight
      # (everything but the spot at its darkest from the first frame: the preset's own wash, chandeliers,
      # candelabras off, the ambient at half (0.06: the door still reads); they come up with the fade to House)
      Lighting/Chandeliers: 0.001
      Lighting/Stage wash: 0.02
      Lighting/Candelabras: 0.02
      Lighting/Ambient (probe): 0.06
    screen: off
    door: { which: stage-right, open: 0 }
    focus: { distance: near, blur: 1 }    # (on the door leaf, the hall beyond soft, until it is half open)
    camera: { position: [ -2.40, 1.25, 8.80 ], target: [ 0.00, 1.00, 0.30 ], fov: 70 }
  - after: 0.35
    door: { which: stage-right, open: 1, duration: 1.3, ease: inOutSine }
  # two steps through the door onto the terrace (0.35), facing the piano all the way (walking speeds
