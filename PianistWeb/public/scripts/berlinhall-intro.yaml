# Berlin hall intro: a person walks into the Konzerthaus Berlin's Großer Saal, where the black grand
# stands on the stage, and the smart piano's assistant (小音) shows them round (dialog:
# Footages.local/dialogs/berlinhall.md); then it plays Liszt's Liebestraum No. 3 for them.
# The assistant speaks through the piano: talking-piano MIDI in midi/yin/berlinhall-*.mid (fitted
# from the TTS voice at 1.3x length, as premiere's), the green voice roll, its lines as subtitles.
# The user's lines are recordings in audio/user/berlinhall/ (volumes set to premiere's user level,
# ~0.025 RMS speech on the output; the whisper ~5 dB under). Music: midi/songs/, normal roll.
# Shot on a phone held upright: a 1:2 portrait frame (fov is vertical: 70 the wide view). Load with
# ?style=grand-black&script=berlinhall-intro.yaml (the style is a query, not a script setting); render with
#   node tools/render-video.mjs berlinhall-intro.yaml --query "style=grand-black" --size 1080x2160
# (720x1440 for a quicker one; 540x1080 for previews). Spatialised sound (tools/spatialise.py): a phone
# held upright has its two mics across its short side, --spacing 0.07 (the default 0.14 is one held
# sideways).
#
# Turns are chained with `gap:` (0.2-0.3 s after the previous gap event, and everything timed after
# it, has finished: MIDI + its 0.5 s release tail, recordings' speech, camera moves), thinking 0.4-0.5
# s; a user line that follows an assistant line comes in over its last word (`after:` off it, 0.3-0.4 s
# before its end). Camera moves inside a turn are timed with `after:` off the line and end before it
# does, so they never hold the next turn back: the walking and looking happen during the speech.
# Voice MIDI start with 0.47 s of silence (the 6x roll's look-ahead).
#
# The frame (the hall from src/hall.js fromBerlin): the stage floor y 0, the piano at the origin
# (keyboard front z 0.46, the tail at z -1.12, its lid opening towards +x, the audience); the stage's
# front edge at x 1.3 and the stalls' floor 0.61 m below it (y -0.61) from x 1.5; the centre aisle
# at z 0. Facing the audience (+x), left is -z. The organ / choir side behind the stage at -x, the
# hall's back wall at x ~26, the side walls at z +-10.3, the ceiling at y ~15.6.
# Handheld: the operator model's bursts are off (the phone follows the written path, with shake,
# gait and drift) while the user walks and points round the hall: its sub-movements are fitted to
# a phone moved about while standing (at most 0.42 m/s, 46 deg/s) and lag a walk by seconds. On
# again for the music at the end, standing in the stalls.
# The user enters by the stage-right door (seen from the stage facing the hall; the +z side, the
# keyboard's side, so the piano is in view at once): a plain single door in the stage's side wall at
# x -2.7..-1.8, z +8.19 (src/stagedoors.js: the scan's painted door made a leaf on hinges, swinging
# into the hall, with a short corridor behind it), onto a side terrace at y 0.35, two steps (0.17 each)
# above the stage. The film opens in that corridor, facing the closed door: it swings open (pushed,
# `door:`), the hall dark but for the spotlit piano beyond, and the user walks through; a 0.17 m riser runs along the back of the stage
# (x < -1.25, behind the piano). The camera follows the floor (handheld: { floor: true }; the hall's
# floor map, public/berlinhall/floor.bin from tools/hall-floor.mjs): its y's here are heights above the
# floor under the phone (1.30; 1.20 leaning in to the screen), and each change of floor is taken as a
# step in time with the walk: down the terrace's two steps on the way in, up and down the riser behind
# the piano, and off the stage's 0.61 m front edge in one stride into the stalls.
#
# Lighting (the hall's presets): Spotlight at first, the chandeliers out (Lighting/Chandeliers 0:
# their candles, glow and crystal follow it); as the screen powers on, a 4 s fade to House lights up,
# the chandeliers coming up with it (the preset's own value); Recital as the assistant says lets-play-liebestraum; Liebestraum starts 2 s
# after that line has ended, and 2 s later the light fades (4 s) back to Spotlight.
#
# The busts (Footages.local/Berlin-Hall/generated/busts/relief/placements.json): the dialog's
# 左手边 wall is the audience's left (+z: Bach, Telemann, Gluck, Mozart, Schubert), its 右手边 the
# -z wall (Handel, C. P. E. Bach, Haydn, Beethoven, Weber); Brahms and Wagner on the back wall
# (Mendelssohn and Schumann have no placement); the upper tier at y ~9.2.
title: Berlin hall — an introduction
seed: 1

timeline:
